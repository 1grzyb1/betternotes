name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            target: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output betternotes \
            target/aarch64-apple-darwin/release/betternotes \
            target/x86_64-apple-darwin/release/betternotes

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=BetterNotes.app
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp betternotes $APP/Contents/MacOS/BetterNotes
          cp assets/icon.icns $APP/Contents/Resources/icon.icns
          cat > $APP/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>BetterNotes</string>
            <key>CFBundleDisplayName</key><string>BetterNotes</string>
            <key>CFBundleIdentifier</key><string>com.grzybek.betternotes</string>
            <key>CFBundleExecutable</key><string>BetterNotes</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - $APP
          ditto -c -k --keepParent $APP BetterNotes-${{ matrix.name }}.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/betternotes.exe BetterNotes.exe
          Compress-Archive -Path BetterNotes.exe -DestinationPath BetterNotes-${{ matrix.name }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p BetterNotes
          cp target/${{ matrix.target }}/release/betternotes BetterNotes/
          cp assets/icon.png BetterNotes/betternotes.png
          tar czf BetterNotes-${{ matrix.name }}.tar.gz BetterNotes

      - uses: actions/upload-artifact@v5
        with:
          name: BetterNotes-${{ matrix.name }}
          path: BetterNotes-${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

