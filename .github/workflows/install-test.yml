name: Install test

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
      - run: test -x ~/.local/bin/betternotes && test -f ~/.local/share/applications/betternotes.desktop

  windows:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
      - shell: pwsh
        run: |
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\BetterNotes\BetterNotes.exe")) { throw 'exe missing' }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Programs'))\BetterNotes.lnk")) { throw 'shortcut missing' }
